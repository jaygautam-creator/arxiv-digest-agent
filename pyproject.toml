[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxiv-digest-agent"
version = "0.1.0"
description = "Autonomous arXiv Paper Digest & QA Agent with stateful graph orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Jay Gautam", email = "jaygautam561@gmail.com" }
]
keywords = [
    "arxiv",
    "research-agent",
    "state-graph",
    "rag",
    "vector-search",
    "llm",
    "paper-digest",
    "literature-review"
]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "rich>=13.0.0",
    "pypdf>=3.17.0",
    "pymupdf>=1.23.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
]
# Local dense retrieval + reranking (ONNX on CPU, no PyTorch). Without it, retrieval is TF-IDF only.
embeddings = [
    "fastembed>=0.5.0",
]

[project.scripts]
arxiv-digest = "arxiv_digest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["arxiv_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, import order, pyupgrade, simplify
select = ["F", "E", "W", "B", "I", "UP", "SIM"]
ignore = ["SIM905"]  # a """...""".split() word list reads better than a 150-line literal

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
