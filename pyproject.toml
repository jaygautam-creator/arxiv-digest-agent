[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxiv-digest-agent"
version = "0.1.0"
description = "Autonomous arXiv Paper Digest & QA Agent with stateful graph orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Jay Gautam", email = "jaygautam561@gmail.com" }
]
keywords = [
    "arxiv",
    "research-agent",
    "state-graph",
    "rag",
    "vector-search",
    "llm",
    "paper-digest",
    "literature-review"
]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "rich>=13.0.0",
    "pypdf>=3.17.0",
    "pymupdf>=1.23.0; platform_machine != 'fake'",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
gemini = [
    "google-generativeai>=0.4.0",
]
groq = [
    "groq>=0.4.0",
]
all = [
    "google-generativeai>=0.4.0",
    "groq>=0.4.0",
    "pytest>=7.4.0",
]

[project.scripts]
arxiv-digest = "arxiv_digest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["arxiv_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
