name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check arxiv_digest evals tests && ruff format --check arxiv_digest evals tests
      - name: Type-check
        run: mypy arxiv_digest evals
      - name: Tests (offline, no API keys)
        run: pytest tests/ -q
